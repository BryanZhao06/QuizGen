version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: quizgen_redis
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

  api:
    build: .
    container_name: quizgen_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
    restart: unless-stopped